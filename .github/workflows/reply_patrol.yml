name: Mirintya AI Reply Patrol

on:
  schedule:
    # 毎日3回実行するよ！
    # （日本時間：12:00、18:00、22:00）
    # UTC（世界標準時）: 03:00, 09:00, 13:00
    - cron: '0 3,9,13 * * *'
  workflow_dispatch: # 手動実行ボタン

jobs:
  reply:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests
          playwright install chromium

      - name: Create state.json from Secret
        run: |
          echo '${{ secrets.NOTE_STATE_JSON }}' > state.json

      - name: Run reply patrol script
        env:
          GAS_URL: ${{ secrets.GAS_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }} # 🔑 Secretsから安全にキーを受け取ります！
        run: |
          python reply_bot.py
