name: Mirintya Note Auto Post

on:
  schedule:
    # 毎日日本時間の夜19:30に実行（UTCだとAM10:30）
    - cron: '30 10 * * *'
  workflow_dispatch: # 手動でいつでも実行できるようにするボタン

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests
          playwright install chromium

      - name: Create state.json from Secret
        run: |
          # GitHubのSecretからCookie情報を復元してファイルにする
          echo '${{ secrets.NOTE_STATE_JSON }}' > state.json

      - name: Run posting script
        env:
          GAS_URL: ${{ secrets.GAS_URL }}
        run: |
          # 投稿スクリプトを実行
          python post_to_note.py
